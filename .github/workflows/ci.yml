name: ci

on:
  push:
    branches: [main]
  pull_request:

# 分层门禁（计划书 §7 / contract-017.md）：
#   job check        — 构建、类型、单测（mock 层）、脚本字节级编码 + PS5.1 解析
#   job integration  — 真实宿主 fixture 非交互集成：0.1.7-rc.2 为强制门，
#                      0.1.5-rc.1 fixture 仅安装校验；回归用例待补。
#   人工 Toast 测试（test:approval）不入 CI。

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # 单测里的 dialog.scripts.test.js 用 powershell.exe（真实 5.1）做
      # Parser::ParseFile 语法门禁——windows-latest 自带 5.1，满足
      # "不能用 pwsh 解析代替实际执行环境"的要求。
      - run: npm run test:unit

      # 这个插件的功能正确性依赖脚本的字节级编码：
      #   .ps1 含非 ASCII 时必须带 UTF-8 BOM（否则 PS 5.1 按 ANSI 解码 → 语法错误 →
      #   exit 1 → 被误报成"用户拒绝"）；.vbs 必须纯 ASCII。
      # 一个编辑器的一次"另存为"就能破坏它，所以在 CI 里守住。
      - name: assert script encodings, CRLF line endings and PowerShell syntax
        shell: pwsh
        run: |
          $fail = 0
          foreach ($f in Get-ChildItem scripts -File) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            $bom = $b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF
            $nonAscii = 0; foreach ($x in $b) { if ($x -ge 0x80) { $nonAscii++ } }
            # R2 §6 打包门：npm pack 打包的是**工作树文件**而不是 git blob，
            # 所以 .gitattributes 的 eol=crlf 不能保证入包换行，必须在这里按字节核验。
            # .ps1/.vbs 的最终交付换行必须是 CRLF（与既有脚本一致，避免混入裸 LF）。
            $crlf = 0; $bareLf = 0
            for ($i = 0; $i -lt $b.Length; $i++) {
              if ($b[$i] -eq 0x0A) { if ($i -gt 0 -and $b[$i-1] -eq 0x0D) { $crlf++ } else { $bareLf++ } }
            }
            Write-Host ("{0,-28} bom={1,-5} nonAscii={2,-5} crlf={3,-5} bareLf={4}" -f $f.Name, $bom, $nonAscii, $crlf, $bareLf)
            if ($bareLf -gt 0) { Write-Host "::error file=scripts/$($f.Name)::contains $bareLf bare LF; scripts must ship CRLF"; $fail++ }
            if ($crlf -eq 0) { Write-Host "::error file=scripts/$($f.Name)::no CRLF found; scripts must ship CRLF"; $fail++ }
            # R2 §6 完整性门：拒绝"只有 BOM/空白"的脚本（R1 实测事故：3 字节 BOM-only
            # 能通过 非空+BOM+语法 三项检查却什么都不做，sender 会以 exit 0 静默假成功）。
            $start = 0
            if ($bom) { $start = 3 }
            elseif ($b.Length -ge 2 -and (($b[0] -eq 0xFF -and $b[1] -eq 0xFE) -or ($b[0] -eq 0xFE -and $b[1] -eq 0xFF))) { $start = 2 }
            $hasContent = $false
            for ($i = $start; $i -lt $b.Length; $i++) {
              $x = $b[$i]
              if ($x -ne 0x20 -and $x -ne 0x09 -and $x -ne 0x0D -and $x -ne 0x0A -and $x -ne 0x0B -and $x -ne 0x0C) { $hasContent = $true; break }
            }
            if (-not $hasContent) { Write-Host "::error file=scripts/$($f.Name)::BOM/whitespace-only script (would silently no-op)"; $fail++ }
            if ($f.Extension -eq '.ps1') {
              if ($nonAscii -gt 0 -and -not $bom) { Write-Host "::error file=scripts/$($f.Name)::contains non-ASCII but no UTF-8 BOM"; $fail++ }
              $e = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
              if (@($e).Count -gt 0) { Write-Host "::error file=scripts/$($f.Name)::$($e[0].Message)"; $fail++ }
            }
            elseif ($f.Extension -eq '.vbs') {
              if ($nonAscii -gt 0) { Write-Host "::error file=scripts/$($f.Name)::.vbs must stay pure ASCII"; $fail++ }
            }
          }
          if ($fail -gt 0) { throw "$fail script packaging gate(s) failed" }
          Write-Host 'script packaging gates passed'

  integration:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: install exact DSH 0.1.7-rc.2 test fixture (mandatory)
        shell: pwsh
        working-directory: test/integration
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'target fixture install failed' }
          node -e "for(const n of ['dsh-llm','dsh-scope','dsh-session','dsh-user-approval']) { const v=require('./node_modules/@deepseek-ai/'+n+'/package.json').version; if(v!=='0.1.7-rc.2') throw new Error(n+' version drift: '+v) }"
          if ($LASTEXITCODE -ne 0) { throw 'target fixture version drift' }
      - name: install exact DSH 0.1.5-rc.1 fixture (observation only)
        shell: pwsh
        working-directory: test/integration/fixture-015
        continue-on-error: true
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'legacy fixture install failed' }
          node -e "for(const n of ['dsh-llm','dsh-scope','dsh-session','dsh-user-approval']) { const v=require('./node_modules/@deepseek-ai/'+n+'/package.json').version; if(v!=='0.1.5-rc.1') throw new Error(n+' version drift: '+v) }"
          if ($LASTEXITCODE -ne 0) { throw 'legacy fixture version drift' }
      # 0.1.7-rc.2 是强制门：失败即红
      - run: npm run test:integration
